behaviors:
  CaptureTheFlagAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 1.0e-3
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
      #strength: 1.0

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.99
        #strength: 1.0

    behavioral_cloning:
      demo_path: null
      #strength: 0.5
      steps: 0

    max_steps: 1e6
    time_horizon: 128
    summary_freq: 5000
    threaded: true
    keep_checkpoints: 5

    self_play:
      save_steps: 50000
      team_change: 200000
      swap_steps: 25000
      window: 10
      play_against_latest_model_ratio: 0.5
      initial_elo: 1200
